<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050210"/>
      <stop offset="50%"  stop-color="#0c0620"/>
      <stop offset="100%" stop-color="#060215"/>
    </linearGradient>

    <!-- Orb radials -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>

    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e2b4ff"/>
      <stop offset="25%"  stop-color="#c084fc"/>
      <stop offset="50%"  stop-color="#e879f9"/>
      <stop offset="75%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Wave gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="25%"  stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#c084fc"/>
      <stop offset="75%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="30%"  stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#e879f9" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="20%"  stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="50%"  stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="80%"  stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Shimmer sweep -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="45%"  stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-860 0" to="860 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(168,85,247,0.08)" stroke-width="0.8"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(5,2,16,0.6)"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="nameGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="waveGlow" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>



  <!-- Twinkling stars -->
  <circle cx="60"  cy="18" r="1.2" fill="white" opacity="0.0"><animate attributeName="opacity" values="0;0.5;0" dur="3s"   repeatCount="indefinite"/></circle>
  <circle cx="160" cy="30" r="1"   fill="white" opacity="0.0"><animate attributeName="opacity" values="0;0.4;0" dur="4.5s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="320" cy="12" r="1.5" fill="#c084fc" opacity="0.0"><animate attributeName="opacity" values="0;0.6;0" dur="3.8s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="540" cy="22" r="1"   fill="white" opacity="0.0"><animate attributeName="opacity" values="0;0.4;0" dur="5s"   repeatCount="indefinite" begin="2s"/></circle>
  <circle cx="700" cy="14" r="1.2" fill="#818cf8" opacity="0.0"><animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="1.5s"/></circle>
  <circle cx="800" cy="30" r="1"   fill="white" opacity="0.0"><animate attributeName="opacity" values="0;0.3;0" dur="6s"   repeatCount="indefinite" begin="3s"/></circle>

  <!-- Corner neon accents -->
  <path d="M12,40 L12,12 L40,12" fill="none" stroke="rgba(168,85,247,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M848,40 L848,12 L820,12" fill="none" stroke="rgba(99,102,241,0.45)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12,120 L12,148 L40,148" fill="none" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M848,120 L848,148 L820,148" fill="none" stroke="rgba(168,85,247,0.45)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top neon line -->
  <line x1="60" y1="1" x2="800" y2="1" stroke="url(#waveGrad1)" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Decorative line above name -->
  <line x1="60" y1="28" x2="800" y2="28" stroke="url(#waveGrad1)" stroke-width="0.6" opacity="0.25"/>

  <!-- Small pill -->
  <rect x="332" y="16" width="196" height="18" rx="9"
    fill="rgba(168,85,247,0.08)"
    stroke="rgba(168,85,247,0.22)" stroke-width="0.8"/>
  <circle cx="349" cy="25" r="3.5" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="430" y="29" text-anchor="middle"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="9" font-weight="600" letter-spacing="2"
    fill="rgba(192,132,252,0.8)">OPEN TO OPPORTUNITIES</text>

  <!-- Name glow shadow -->
  <text x="430" y="96" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="66" font-weight="700" letter-spacing="-2"
    fill="rgba(192,132,252,0.2)"
    filter="url(#nameGlow)">Humera Mahreen</text>

  <!-- Main name -->
  <text x="430" y="96" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="66" font-weight="700" letter-spacing="-2"
    fill="url(#nameGrad)">
    Humera Mahreen
    <animate attributeName="opacity" values="0.92;1;0.92" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Shimmer sweep -->
  <text x="430" y="96" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="66" font-weight="700" letter-spacing="-2"
    fill="url(#shimmer)" opacity="0.5">Humera Mahreen</text>

  <!-- Tagline -->
  <text x="430" y="118" text-anchor="middle"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="11.5" font-weight="400" letter-spacing="3.5"
    fill="rgba(196,168,255,0.45)">
    APPLIED AI  ·  GENAI  ·  AGENTIC AI EXPLORER
  </text>

  <!-- ── WAVES ── -->
  <path d="M0,140 C120,126 200,146 320,135 C440,122 500,142 620,130 C740,118 800,138 860,128"
    fill="none" stroke="url(#waveGrad3)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="d"
      values="
        M0,140 C120,126 200,146 320,135 C440,122 500,142 620,130 C740,118 800,138 860,128;
        M0,128 C120,142 200,126 320,140 C440,150 500,130 620,142 C740,150 800,130 860,140;
        M0,140 C120,126 200,146 320,135 C440,122 500,142 620,130 C740,118 800,138 860,128"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <path d="M0,145 C100,131 180,150 290,139 C400,126 460,147 570,135 C680,122 760,143 860,133"
    fill="none" stroke="url(#waveGrad2)" stroke-width="2" filter="url(#waveGlow)" opacity="0.8">
    <animate attributeName="d"
      values="
        M0,145 C100,131 180,150 290,139 C400,126 460,147 570,135 C680,122 760,143 860,133;
        M0,133 C100,147 180,130 290,144 C400,154 460,134 570,146 C680,154 760,133 860,145;
        M0,145 C100,131 180,150 290,139 C400,126 460,147 570,135 C680,122 760,143 860,133"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <path d="M0,150 C110,137 190,154 300,143 C410,130 470,152 580,141 C690,128 770,149 860,139"
    fill="none" stroke="url(#waveGrad1)" stroke-width="2.5" filter="url(#waveGlow)">
    <animate attributeName="d"
      values="
        M0,150 C110,137 190,154 300,143 C410,130 470,152 580,141 C690,128 770,149 860,139;
        M0,139 C110,152 190,134 300,150 C410,160 470,138 580,152 C690,160 770,139 860,150;
        M0,150 C110,137 190,154 300,143 C410,130 470,152 580,141 C690,128 770,149 860,139"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Glowing dots -->
  <circle cx="200" cy="143" r="2.5" fill="#c084fc" filter="url(#dotGlow)">
    <animate attributeName="cy" values="143;133;143" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="141" r="2" fill="#e879f9" filter="url(#dotGlow)">
    <animate attributeName="cy" values="141;150;141" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="139" r="2.5" fill="#818cf8" filter="url(#dotGlow)">
    <animate attributeName="cy" values="139;150;139" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom scan bar -->
  <rect x="0" y="157" width="860" height="2" rx="1" fill="url(#waveGrad1)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
