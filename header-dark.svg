<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <foreignObject width="860" height="280">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        .root {
          width: 860px;
          height: 280px;
          background: linear-gradient(135deg, #050210 0%, #0c0620 45%, #080318 75%, #060215 100%);
          border-radius: 14px;
          overflow: hidden;
          position: relative;
          font-family: 'Segoe UI', system-ui, sans-serif;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 44px;
          gap: 24px;
        }

        /* Grid */
        .grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(168,85,247,0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(168,85,247,0.07) 1px, transparent 1px);
          background-size: 36px 36px;
          pointer-events: none;
        }

        /* Scanlines */
        .scanlines {
          position: absolute;
          inset: 0;
          background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
          pointer-events: none;
        }

        /* Orbs */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(55px);
          pointer-events: none;
          animation: floatOrb ease-in-out infinite;
        }
        .o1 { width:280px;height:280px; background:radial-gradient(circle,rgba(124,58,237,0.55) 0%,transparent 70%); top:-80px;left:-60px; animation-duration:8s; }
        .o2 { width:260px;height:260px; background:radial-gradient(circle,rgba(79,70,229,0.4) 0%,transparent 70%);  bottom:-70px;right:-40px; animation-duration:10s; animation-delay:-3s; }
        .o3 { width:180px;height:180px; background:radial-gradient(circle,rgba(232,121,249,0.28) 0%,transparent 70%); top:50%;left:50%; transform:translate(-50%,-50%); animation-duration:13s; animation-delay:-6s; }

        @keyframes floatOrb {
          0%,100%{ transform:translate(0,0); }
          33%    { transform:translate(16px,-12px); }
          66%    { transform:translate(-10px,14px); }
        }
        .o3 { animation-name: floatOrb3; }
        @keyframes floatOrb3 {
          0%,100%{ transform:translate(-50%,-50%); }
          33%    { transform:translate(calc(-50% + 16px),calc(-50% - 12px)); }
          66%    { transform:translate(calc(-50% - 10px),calc(-50% + 14px)); }
        }

        /* Neon top/bottom edges */
        .edge-top, .edge-bot {
          position:absolute; left:8%; right:8%; height:1px;
          background: linear-gradient(90deg, transparent, rgba(168,85,247,0.7), transparent);
          box-shadow: 0 0 6px rgba(168,85,247,0.5);
          animation: edgePulse 4s ease-in-out infinite;
        }
        .edge-top { top:0; }
        .edge-bot { bottom:0; animation-delay:-2s; }
        @keyframes edgePulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }

        /* Bottom scan line */
        .scan-line {
          position:absolute; bottom:0; left:0; right:0; height:2px;
          background: linear-gradient(90deg, transparent 0%, #7c3aed 20%, #c084fc 50%, #6366f1 80%, transparent 100%);
          background-size: 200% 100%;
          box-shadow: 0 0 8px rgba(168,85,247,0.7);
          animation: scanMove 3.5s linear infinite;
        }
        @keyframes scanMove { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }

        /* Stars */
        .star { position:absolute; border-radius:50%; background:white; animation:twinkle ease-in-out infinite; pointer-events:none; }
        .s1{width:2px;height:2px;top:10%;left:44%;opacity:.2;animation-duration:3s;}
        .s2{width:1.5px;height:1.5px;top:22%;left:58%;opacity:.15;animation-duration:4.5s;animation-delay:-2s;}
        .s3{width:2px;height:2px;top:70%;left:38%;opacity:.18;animation-duration:5s;animation-delay:-1s;}
        .s4{width:1px;height:1px;top:55%;left:68%;opacity:.15;animation-duration:3.5s;animation-delay:-3s;}
        @keyframes twinkle { 0%,100%{opacity:.05;transform:scale(1);} 50%{opacity:.45;transform:scale(1.6);} }

        /* Dot matrix */
        .dots {
          position:absolute; top:16px; right:310px;
          display:grid; grid-template-columns:repeat(7,1fr); gap:8px;
          opacity: 0.15; pointer-events:none;
        }
        .d { width:2.5px;height:2.5px;border-radius:50%;background:#a855f7; }

        /* Floating particles */
        .particles { position:absolute;inset:0;pointer-events:none; }
        .p { position:absolute;border-radius:50%;animation:floatP linear infinite; }
        .p1{width:3px;height:3px;left:12%;top:80%;background:rgba(192,132,252,.7);box-shadow:0 0 4px rgba(192,132,252,.8);animation-duration:6s;}
        .p2{width:2px;height:2px;left:55%;top:10%;background:rgba(129,140,248,.7);animation-duration:8s;animation-delay:-2s;}
        .p3{width:4px;height:4px;left:78%;top:85%;background:rgba(99,102,241,.6);box-shadow:0 0 5px rgba(99,102,241,.8);animation-duration:5s;animation-delay:-1s;}
        .p4{width:2px;height:2px;left:30%;top:8%;background:rgba(232,121,249,.7);animation-duration:7s;animation-delay:-4s;}
        @keyframes floatP { 0%{transform:translateY(0);opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-60px);opacity:0;} }

        /* ── LEFT CARD ── */
        .card {
          position: relative;
          z-index: 2;
          flex: 1 1 auto;
          padding: 26px 30px;
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(168,85,247,0.22);
          border-radius: 14px;
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          box-shadow: 0 0 40px rgba(124,58,237,0.18), inset 0 1px 0 rgba(255,255,255,0.04);
          animation: fadeUp 0.8s ease forwards;
        }
        /* Corner accents */
        .card::before {
          content:''; position:absolute; top:-1px; left:-1px;
          width:36px; height:36px;
          border-top:2px solid rgba(168,85,247,0.8);
          border-left:2px solid rgba(168,85,247,0.8);
          border-radius:14px 0 0 0;
          box-shadow:-1px -1px 8px rgba(168,85,247,0.35);
        }
        .card::after {
          content:''; position:absolute; bottom:-1px; right:-1px;
          width:36px; height:36px;
          border-bottom:2px solid rgba(99,102,241,0.6);
          border-right:2px solid rgba(99,102,241,0.6);
          border-radius:0 0 14px 0;
          box-shadow:1px 1px 8px rgba(99,102,241,0.25);
        }

        @keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

        .pill {
          display: inline-flex; align-items:center; gap:7px;
          background: rgba(168,85,247,0.1);
          border: 1px solid rgba(168,85,247,0.3);
          border-radius: 999px;
          padding: 4px 13px;
          font-size: 11px; font-weight:600; color:#c084fc;
          letter-spacing: 1.3px; text-transform:uppercase;
          margin-bottom: 12px;
          box-shadow: 0 0 10px rgba(192,132,252,0.12);
        }
        .live-dot {
          width:7px; height:7px; border-radius:50%;
          background:#4ade80;
          box-shadow: 0 0 6px #4ade80, 0 0 12px rgba(74,222,128,0.35);
          animation: pulseLive 2s ease-in-out infinite;
        }
        @keyframes pulseLive { 0%,100%{opacity:1;box-shadow:0 0 6px #4ade80,0 0 12px rgba(74,222,128,.35);} 50%{opacity:.5;box-shadow:0 0 2px #4ade80;} }

        .name {
          font-size: 42px; font-weight:800; letter-spacing:-1.2px; line-height:1;
          background: linear-gradient(90deg, #c084fc, #e879f9, #818cf8, #c084fc);
          background-size: 300% auto;
          -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip:text;
          filter: drop-shadow(0 0 18px rgba(192,132,252,0.4));
          margin-bottom: 9px;
          animation: nameShimmer 4s linear infinite;
        }
        @keyframes nameShimmer { 0%{background-position:0% center;} 100%{background-position:300% center;} }

        .tagline {
          font-size: 13.5px; color:rgba(216,180,254,0.68);
          letter-spacing:0.3px; margin-bottom:18px;
        }

        .badges { display:flex; gap:9px; flex-wrap:wrap; }
        .badge {
          display:inline-flex; align-items:center; gap:5px;
          background:rgba(168,85,247,0.07);
          border:1px solid rgba(168,85,247,0.2);
          border-radius:7px; padding:5px 11px;
          font-size:11.5px; color:rgba(216,180,254,0.85); font-weight:500;
          box-shadow: inset 0 1px 0 rgba(168,85,247,0.08);
        }

        /* ── RIGHT TERMINAL ── */
        .terminal {
          position: relative;
          z-index: 2;
          flex: 0 0 266px;
          width: 266px;
          background: rgba(5,2,16,0.75);
          border: 1px solid rgba(168,85,247,0.2);
          border-radius: 12px;
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
          box-shadow: 0 8px 40px rgba(124,58,237,0.22), 0 0 60px rgba(168,85,247,0.06), inset 0 1px 0 rgba(255,255,255,0.04);
          overflow: hidden;
          animation: fadeUp 0.9s 0.2s ease both;
        }
        .terminal::before {
          content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
          background:linear-gradient(90deg,transparent,rgba(168,85,247,0.9),transparent);
          box-shadow:0 0 8px rgba(168,85,247,0.5);
        }

        .tbar {
          display:flex; align-items:center; gap:6px;
          padding:9px 14px;
          background:rgba(168,85,247,0.06);
          border-bottom:1px solid rgba(168,85,247,0.1);
        }
        .tb { width:10px; height:10px; border-radius:50%; }
        .tbr{background:#f87171;box-shadow:0 0 4px rgba(248,113,113,.5);}
        .tby{background:#fbbf24;box-shadow:0 0 4px rgba(251,191,36,.5);}
        .tbg{background:#4ade80;box-shadow:0 0 4px rgba(74,222,128,.5);}
        .ttitle { margin-left:auto; font-size:10.5px; color:rgba(168,85,247,.55); font-family:'Courier New',monospace; }

        .code {
          padding:14px 18px;
          font-family:'Courier New',monospace; font-size:12px; line-height:1.85;
        }
        .kw{color:#c084fc;font-weight:600;}
        .cn{color:#818cf8;}
        .st{color:#86efac;}
        .op{color:rgba(168,85,247,.9);}
        .cm{color:rgba(148,163,184,.45);font-style:italic;}
        .cursor {
          display:inline-block; width:7px; height:13px;
          background:#c084fc; border-radius:2px; vertical-align:middle;
          box-shadow:0 0 7px rgba(192,132,252,.9),0 0 14px rgba(192,132,252,.4);
          animation:blink 1.1s step-end infinite;
        }
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
      </style>

      <div class="root">
        <div class="grid"></div>
        <div class="scanlines"></div>
        <div class="edge-top"></div>
        <div class="edge-bot"></div>
        <div class="scan-line"></div>

        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>

        <div class="dots">
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
        </div>

        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>

        <div class="particles">
          <div class="p p1"></div><div class="p p2"></div>
          <div class="p p3"></div><div class="p p4"></div>
        </div>

        <!-- LEFT: Info card -->
        <div class="card">
          <div class="pill"><div class="live-dot"></div>Open to opportunities</div>
          <div class="name">Humera Mahreen</div>
          <div class="tagline">Applied AI &#160;&#183;&#160; GenAI &#160;&#183;&#160; Agentic AI Explorer</div>
          <div class="badges">
            <div class="badge">🤖 Machine Learning</div>
            <div class="badge">✨ GenAI &amp; LLMs</div>
            <div class="badge">📍 Hyderabad, IN</div>
          </div>
        </div>

        <!-- RIGHT: Terminal -->
        <div class="terminal">
          <div class="tbar">
            <div class="tb tbr"></div>
            <div class="tb tby"></div>
            <div class="tb tbg"></div>
            <div class="ttitle">humera.py</div>
          </div>
          <div class="code">
            <div><span class="kw">class</span> <span class="cn">Humera</span><span class="op">:</span></div>
            <div><span class="cm">&#160;&#160;# ML Explorer &#x1F680;</span></div>
            <div><span class="cn">&#160;&#160;passion</span> <span class="op">=</span> <span class="st">"ML &amp; GenAI"</span></div>
            <div><span class="cn">&#160;&#160;focus</span><span class="op">&#160;&#160;=</span> <span class="st">"GenAI &amp; LLMs"</span></div>
            <div><span class="cn">&#160;&#160;goal</span><span class="op">&#160;&#160;&#160;=</span> <span class="st">"Build &amp; Solve"</span></div>
            <div><span class="cn">&#160;&#160;city</span><span class="op">&#160;&#160;&#160;=</span> <span class="st">"Hyderabad &#x1F1EE;&#x1F1F3;"</span></div>
            <div>&#160;&#160;<span class="cursor"></span></div>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
