<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0a1a"/>
      <stop offset="50%" stop-color="#130d2e"/>
      <stop offset="100%" stop-color="#0f0a20"/>
    </linearGradient>

    <radialGradient id="orb1d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="shimmerDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="40%" stop-color="rgba(196,132,252,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="gridDark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>

    <filter id="glowDark">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGradDark)"/>
  <rect width="1200" height="280" rx="16" fill="url(#gridDark)"/>

  <!-- Animated orbs -->
  <ellipse cx="100" cy="80" rx="200" ry="170" fill="url(#orb1d)" filter="url(#glowDark)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 25,12; 0,0" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1100" cy="200" rx="220" ry="180" fill="url(#orb2d)" filter="url(#glowDark)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -18,14; 0,0" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="580" cy="290" rx="240" ry="130" fill="url(#orb3d)" filter="url(#glowDark)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 12,-22; 0,0" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Stars / sparkles -->
  <g fill="#c084fc">
    <circle cx="180" cy="30" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="55" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="25" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="45" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="30" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="150" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="240" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="220" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Dot grid top-right -->
  <g opacity="0.25">
    <circle cx="1000" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1020" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1040" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1060" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1080" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1000" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1020" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1040" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1060" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1080" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1000" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="1020" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="1040" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="1060" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="1080" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="1100" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1120" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1140" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1160" cy="30" r="1.5" fill="#c084fc"/>
    <circle cx="1100" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1120" cy="50" r="1.5" fill="#c084fc"/>
    <circle cx="1100" cy="70" r="1.5" fill="#c084fc"/>
    <circle cx="1120" cy="70" r="1.5" fill="#c084fc"/>
  </g>

  <!-- Floating particles -->
  <circle cx="200" cy="205" r="3" fill="#c084fc" opacity="0.5">
    <animate attributeName="cy" values="205;190;205" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="85" r="2.5" fill="#818cf8" opacity="0.5">
    <animate attributeName="cy" values="85;70;85" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="245" r="2" fill="#e879f9" opacity="0.4">
    <animate attributeName="cy" values="245;230;245" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Horizontal line accent -->
  <line x1="80" y1="178" x2="520" y2="178" stroke="url(#textGradDark)" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Big bracket decorations -->
  <text x="66" y="112" font-family="monospace" font-size="74" fill="#a855f7" opacity="0.07" font-weight="bold">{</text>
  <text x="1108" y="232" font-family="monospace" font-size="74" fill="#818cf8" opacity="0.06" font-weight="bold">}</text>

  <!-- Main content -->
  <g>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>

    <!-- Greeting pill -->
    <rect x="80" y="46" width="140" height="26" rx="13" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="150" y="63" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c084fc" font-weight="600" text-anchor="middle" letter-spacing="1.5">✦ HELLO WORLD</text>

    <!-- Main name -->
    <text x="80" y="130" font-family="'Segoe UI', Georgia, serif" font-size="58" font-weight="700" fill="url(#textGradDark)" letter-spacing="-1">
      Humera Mahreen
    </text>

    <!-- Shimmer on name -->
    <rect x="80" y="78" width="620" height="60" fill="url(#shimmerDark)" rx="4"/>

    <!-- Tagline -->
    <text x="82" y="162" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#d8b4fe" font-weight="400" letter-spacing="0.3" opacity="0.75">
      ML Explorer · Data Science · AI-Driven Solutions
    </text>

    <!-- Status badge -->
    <rect x="82" y="192" width="196" height="30" rx="6" fill="#c084fc" fill-opacity="0.08" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.3"/>
    <circle cx="101" cy="207" r="5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="113" y="212" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d8b4fe" font-weight="500">Currently learning ML 🚀</text>

    <!-- Location badge -->
    <rect x="290" y="192" width="148" height="30" rx="6" fill="#c084fc" fill-opacity="0.08" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.3"/>
    <text x="364" y="212" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d8b4fe" font-weight="500" text-anchor="middle">📍 Hyderabad, IN</text>
  </g>

  <!-- Code panel -->
  <g>
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    <rect x="780" y="70" width="350" height="148" rx="10" fill="#1e1040" fill-opacity="0.8" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.2"/>

    <!-- Window dots -->
    <circle cx="804" cy="90" r="5" fill="#f87171" opacity="0.7"/>
    <circle cx="822" cy="90" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="840" cy="90" r="5" fill="#4ade80" opacity="0.7"/>

    <!-- Code -->
    <text x="800" y="118" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#c084fc">class</tspan>
      <tspan fill="#e9d5ff"> Humera</tspan>
      <tspan fill="#c084fc">:</tspan>
    </text>
    <text x="800" y="136" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#818cf8">  passion </tspan><tspan fill="#c084fc">= </tspan><tspan fill="#86efac">"ML &amp; AI"</tspan>
    </text>
    <text x="800" y="154" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#818cf8">  focus   </tspan><tspan fill="#c084fc">= </tspan><tspan fill="#86efac">"Data Science"</tspan>
    </text>
    <text x="800" y="172" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#818cf8">  goal    </tspan><tspan fill="#c084fc">= </tspan><tspan fill="#86efac">"Build &amp; Solve"</tspan>
    </text>
    <text x="800" y="192" font-family="'Courier New', monospace" font-size="12.5" fill="#c084fc">
      <tspan>  </tspan><tspan fill="#e879f9">▌</tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="272" width="1200" height="4" rx="2" fill="url(#textGradDark)" opacity="0.6"/>
  <rect x="0" y="272" width="1200" height="4" rx="2" fill="url(#shimmerDark)"/>
</svg>
