<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <foreignObject width="860" height="280">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        .root {
          width: 860px;
          height: 280px;
          background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 45%, #ede9fe 75%, #e0d7ff 100%);
          border-radius: 14px;
          overflow: hidden;
          position: relative;
          font-family: 'Segoe UI', system-ui, sans-serif;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 44px;
          gap: 24px;
        }

        .grid {
          position:absolute; inset:0;
          background-image:
            linear-gradient(rgba(139,92,246,0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(139,92,246,0.08) 1px, transparent 1px);
          background-size: 36px 36px;
          pointer-events:none;
        }

        .orb { position:absolute; border-radius:50%; filter:blur(52px); pointer-events:none; animation:floatOrb ease-in-out infinite; }
        .o1{width:260px;height:260px;background:radial-gradient(circle,rgba(192,132,252,.45) 0%,transparent 70%);top:-70px;left:-50px;animation-duration:7s;}
        .o2{width:240px;height:240px;background:radial-gradient(circle,rgba(129,140,248,.35) 0%,transparent 70%);bottom:-70px;right:-40px;animation-duration:9s;animation-delay:-3s;}
        .o3{width:180px;height:180px;background:radial-gradient(circle,rgba(232,121,249,.22) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:11s;animation-delay:-5s;}

        @keyframes floatOrb{0%,100%{transform:translate(0,0);}33%{transform:translate(16px,-12px);}66%{transform:translate(-10px,14px);}}
        .o3{animation-name:floatOrb3;}
        @keyframes floatOrb3{0%,100%{transform:translate(-50%,-50%);}33%{transform:translate(calc(-50% + 16px),calc(-50% - 12px));}66%{transform:translate(calc(-50% - 10px),calc(-50% + 14px));}}

        .scan-line {
          position:absolute; bottom:0; left:0; right:0; height:3px;
          background:linear-gradient(90deg,transparent 0%,#a855f7 20%,#7c3aed 50%,#6366f1 80%,transparent 100%);
          background-size:200% 100%; opacity:0.5;
          animation:scanMove 3.5s linear infinite;
        }
        @keyframes scanMove{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

        .dots {
          position:absolute; top:16px; right:310px;
          display:grid; grid-template-columns:repeat(7,1fr); gap:8px;
          opacity:0.18; pointer-events:none;
        }
        .d{width:2.5px;height:2.5px;border-radius:50%;background:#7c3aed;}

        .particles{position:absolute;inset:0;pointer-events:none;}
        .p{position:absolute;border-radius:50%;animation:floatP linear infinite;}
        .p1{width:3px;height:3px;left:12%;top:80%;background:rgba(168,85,247,.5);animation-duration:6s;}
        .p2{width:2px;height:2px;left:55%;top:10%;background:rgba(129,140,248,.5);animation-duration:8s;animation-delay:-2s;}
        .p3{width:3px;height:3px;left:78%;top:85%;background:rgba(99,102,241,.5);animation-duration:5s;animation-delay:-1s;}
        @keyframes floatP{0%{transform:translateY(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-60px);opacity:0;}}

        /* Card */
        .card {
          position:relative; z-index:2;
          flex:0 0 auto; width:460px;
          padding:26px 30px;
          background:rgba(255,255,255,0.42);
          border:1px solid rgba(167,139,250,0.3);
          border-radius:14px;
          backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
          box-shadow:0 8px 32px rgba(124,58,237,0.1),inset 0 1px 0 rgba(255,255,255,0.7);
          animation:fadeUp 0.8s ease forwards;
        }
        .card::before{content:'';position:absolute;top:-1px;left:-1px;width:36px;height:36px;border-top:2px solid rgba(124,58,237,0.6);border-left:2px solid rgba(124,58,237,0.6);border-radius:14px 0 0 0;}
        .card::after{content:'';position:absolute;bottom:-1px;right:-1px;width:36px;height:36px;border-bottom:2px solid rgba(99,102,241,0.5);border-right:2px solid rgba(99,102,241,0.5);border-radius:0 0 14px 0;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

        .pill {
          display:inline-flex; align-items:center; gap:7px;
          background:rgba(124,58,237,0.1); border:1px solid rgba(124,58,237,0.25);
          border-radius:999px; padding:4px 13px;
          font-size:11px; font-weight:600; color:#7c3aed; letter-spacing:1.3px; text-transform:uppercase;
          margin-bottom:12px;
        }
        .live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5);animation:pulseLive 2s ease-in-out infinite;}
        @keyframes pulseLive{0%,100%{opacity:1;}50%{opacity:.5;}}

        .name {
          font-size:42px; font-weight:800; letter-spacing:-1.2px; line-height:1;
          background:linear-gradient(90deg,#7c3aed,#a855f7,#6366f1,#7c3aed);
          background-size:300% auto;
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
          margin-bottom:9px;
          animation:nameShimmer 4s linear infinite;
        }
        @keyframes nameShimmer{0%{background-position:0% center;}100%{background-position:300% center;}}

        .tagline{font-size:13.5px;color:#6d28d9;opacity:.78;letter-spacing:.3px;margin-bottom:18px;}

        .badges{display:flex;gap:9px;flex-wrap:wrap;}
        .badge{
          display:inline-flex;align-items:center;gap:5px;
          background:rgba(124,58,237,0.07);border:1px solid rgba(139,92,246,0.22);
          border-radius:7px;padding:5px 11px;font-size:11.5px;color:#6d28d9;font-weight:500;
        }

        /* Terminal */
        .terminal {
          position:relative; z-index:2;
          flex:0 0 auto; width:266px;
          background:rgba(255,255,255,0.35);
          border:1px solid rgba(167,139,250,0.28);
          border-radius:12px;
          backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
          box-shadow:0 8px 32px rgba(124,58,237,0.09),inset 0 1px 0 rgba(255,255,255,0.65);
          overflow:hidden;
          animation:fadeUp 0.9s 0.2s ease both;
        }

        .tbar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:rgba(124,58,237,0.06);border-bottom:1px solid rgba(139,92,246,0.15);}
        .tb{width:10px;height:10px;border-radius:50%;}
        .tbr{background:#f87171;}.tby{background:#fbbf24;}.tbg{background:#4ade80;}
        .ttitle{margin-left:auto;font-size:10.5px;color:#8b5cf6;font-family:'Courier New',monospace;opacity:.65;}

        .code{padding:14px 18px;font-family:'Courier New',monospace;font-size:12px;line-height:1.85;}
        .kw{color:#7c3aed;font-weight:600;}.cn{color:#4f46e5;}.st{color:#059669;}.op{color:#a855f7;}.cm{color:#9ca3af;font-style:italic;}
        .cursor{display:inline-block;width:7px;height:13px;background:#a855f7;border-radius:2px;vertical-align:middle;animation:blink 1.1s step-end infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
      </style>

      <div class="root">
        <div class="grid"></div>
        <div class="scan-line"></div>

        <div class="dots">
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
        </div>

        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>

        <div class="particles">
          <div class="p p1"></div><div class="p p2"></div><div class="p p3"></div>
        </div>

        <div class="card">
          <div class="pill"><div class="live-dot"></div>Open to opportunities</div>
          <div class="name">Humera Mahreen</div>
          <div class="tagline">Applied AI &#160;&#183;&#160; GenAI &#160;&#183;&#160; Agentic AI Explorer</div>
          <div class="badges">
            <div class="badge">🤖 Machine Learning</div>
            <div class="badge">✨ GenAI &amp; LLMs</div>
            <div class="badge">📍 Hyderabad, IN</div>
          </div>
        </div>

        <div class="terminal">
          <div class="tbar">
            <div class="tb tbr"></div>
            <div class="tb tby"></div>
            <div class="tb tbg"></div>
            <div class="ttitle">humera.py</div>
          </div>
          <div class="code">
            <div><span class="kw">class</span> <span class="cn">Humera</span><span class="op">:</span></div>
            <div><span class="cm">&#160;&#160;# ML Explorer &#x1F680;</span></div>
            <div><span class="cn">&#160;&#160;passion</span> <span class="op">=</span> <span class="st">"ML &amp; GenAI"</span></div>
            <div><span class="cn">&#160;&#160;focus</span><span class="op">&#160;&#160;=</span> <span class="st">"GenAI &amp; LLMs"</span></div>
            <div><span class="cn">&#160;&#160;goal</span><span class="op">&#160;&#160;&#160;=</span> <span class="st">"Build &amp; Solve"</span></div>
            <div><span class="cn">&#160;&#160;city</span><span class="op">&#160;&#160;&#160;=</span> <span class="st">"Hyderabad &#x1F1EE;&#x1F1F3;"</span></div>
            <div>&#160;&#160;<span class="cursor"></span></div>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
