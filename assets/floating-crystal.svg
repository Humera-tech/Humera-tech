<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="faceA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="faceB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="faceC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="faceD" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <radialGradient id="crystalGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <filter id="crystalBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Float + gentle rotate -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -12; 0 0" dur="3.6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Glow behind crystal -->
    <circle cx="110" cy="105" r="60" fill="url(#crystalGlow)"/>

    <!-- Faceted crystal shard -->
    <g filter="url(#crystalBlur)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-4 110 105; 4 110 105; -4 110 105" dur="5s" repeatCount="indefinite"/>

        <!-- top point -->
        <polygon points="110,45 138,90 110,100 82,90" fill="url(#faceA)"/>
        <!-- upper right face -->
        <polygon points="138,90 150,120 110,100" fill="url(#faceB)"/>
        <!-- upper left face -->
        <polygon points="82,90 70,120 110,100" fill="url(#faceC)"/>
        <!-- lower right face -->
        <polygon points="150,120 110,168 110,100" fill="url(#faceC)"/>
        <!-- lower left face -->
        <polygon points="70,120 110,168 110,100" fill="url(#faceD)"/>
        <!-- center seam highlight -->
        <line x1="110" y1="100" x2="110" y2="168" stroke="#f3e8ff" stroke-width="0.6" opacity="0.35"/>
        <line x1="110" y1="100" x2="138" y2="90" stroke="#f3e8ff" stroke-width="0.6" opacity="0.35"/>
        <line x1="110" y1="100" x2="82" y2="90" stroke="#f3e8ff" stroke-width="0.6" opacity="0.35"/>
      </g>
    </g>

    <!-- Sparkle glints -->
    <g fill="#f3e8ff">
      <path d="M 165 65 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 z" opacity="0.9">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 50 140 l 2 5 l 5 2 l -5 2 l -2 5 l -2 -5 l -5 -2 l 5 -2 z" opacity="0.7">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Small drifting motes -->
    <circle cx="60" cy="70" r="1.8" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="150" r="1.6" fill="#e9d5ff">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ground shadow, breathes opposite the float -->
  <ellipse cx="110" cy="188" rx="30" ry="6" fill="#000000" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="30;20;30" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>
</svg>
