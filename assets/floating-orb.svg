<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="orbCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>

    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Whole thing floats up and down -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -14; 0 0" dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Outer soft glow -->
    <circle cx="110" cy="105" r="70" fill="url(#orbGlow)"/>

    <!-- Tilted orbit ring -->
    <ellipse cx="110" cy="105" rx="85" ry="22" fill="none" stroke="url(#ringGrad)" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        values="0 110 105; 360 110 105" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Tiny satellite dot on the ring -->
    <circle r="3.5" fill="#e9d5ff" filter="url(#softGlow)">
      <animateMotion dur="10s" repeatCount="indefinite"
        path="M 25,105 A 85,22 0 1,1 195,105 A 85,22 0 1,1 25,105"/>
    </circle>

    <!-- Core orb -->
    <circle cx="110" cy="105" r="42" fill="url(#orbCore)" filter="url(#softGlow)"/>

    <!-- Subtle highlight -->
    <ellipse cx="95" cy="88" rx="12" ry="7" fill="#ffffff" opacity="0.5"/>

    <!-- Drifting sparkles around the orb -->
    <circle cx="55" cy="60" r="2" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="70" r="1.6" fill="#e9d5ff">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="155" r="2.2" fill="#a855f7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="150" r="1.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Soft drop shadow beneath, breathing opposite to the float -->
  <ellipse cx="110" cy="185" rx="34" ry="7" fill="#000000" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.15;0.35" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="34;24;34" dur="4s" repeatCount="indefinite"/>
  </ellipse>
</svg>
