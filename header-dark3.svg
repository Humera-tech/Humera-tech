<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250">
  <foreignObject width="860" height="250">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        .root {
          width: 860px;
          height: 250px;
          background: linear-gradient(135deg, #050210 0%, #0c0620 50%, #060215 100%);
          border-radius: 12px;
          overflow: hidden;
          position: relative;
          font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ── GRID — fully visible, no cards blocking it ── */
        .grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(168,85,247,0.12) 1px, transparent 1px),
            linear-gradient(90deg, rgba(168,85,247,0.12) 1px, transparent 1px);
          background-size: 40px 40px;
        }

        /* Subtle vignette so edges feel contained */
        .vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at center, transparent 40%, rgba(5,2,16,0.7) 100%);
          pointer-events: none;
        }

        /* ── ORBS ── */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(60px);
          pointer-events: none;
          animation: floatOrb ease-in-out infinite;
        }
        .o1 { width:320px;height:320px; background:rgba(124,58,237,0.4); top:-120px; left:-80px; animation-duration:9s; }
        .o2 { width:260px;height:260px; background:rgba(79,70,229,0.3);  bottom:-100px; right:-60px; animation-duration:11s; animation-delay:-4s; }
        .o3 { width:160px;height:160px; background:rgba(232,121,249,0.2); top:20px; right:300px; animation-duration:7s; animation-delay:-2s; }

        @keyframes floatOrb {
          0%,100% { transform:translate(0,0); }
          50%      { transform:translate(14px,-12px); }
        }

        /* ── NEON LINES ── */
        .nline {
          position: absolute;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(168,85,247,0.6), transparent);
          animation: neonPulse 4s ease-in-out infinite;
        }
        .nl1 { top:0;    left:5%; width:90%; }
        .nl2 { bottom:0; left:5%; width:90%; animation-delay:-2s; }
        @keyframes neonPulse { 0%,100%{opacity:0.4;} 50%{opacity:1; box-shadow:0 0 8px rgba(168,85,247,0.6);} }

        /* Animated bottom bar */
        .bar {
          position: absolute;
          bottom: 0; left:0; right:0;
          height: 2px;
          background: linear-gradient(90deg, transparent, #7c3aed, #c084fc, #818cf8, transparent);
          background-size: 200% 100%;
          animation: barScan 3s linear infinite;
          box-shadow: 0 0 10px rgba(168,85,247,0.7);
        }
        @keyframes barScan { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }

        /* ── STARS ── */
        .star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle ease-in-out infinite; }
        .s1{top:8%;  left:55%; animation-duration:3s;}
        .s2{top:20%; left:72%; animation-duration:4.5s; animation-delay:-1.5s; width:1.5px; height:1.5px;}
        .s3{top:60%; left:48%; animation-duration:5s;   animation-delay:-3s;}
        .s4{top:75%; left:80%; animation-duration:3.5s; animation-delay:-1s;  width:1.5px; height:1.5px;}
        .s5{top:15%; left:38%; animation-duration:6s;   animation-delay:-2s;  width:1px;   height:1px;}
        .s6{top:85%; left:62%; animation-duration:4s;   animation-delay:-3.5s;}
        @keyframes twinkle { 0%,100%{opacity:0.1;} 50%{opacity:0.6;} }

        /* ── DOT MATRIX (top-right decoration) ── */
        .dotgrid {
          position: absolute;
          top: 18px; right: 24px;
          display: grid;
          grid-template-columns: repeat(8, 10px);
          gap: 7px;
          opacity: 0.2;
        }
        .d { width:2px; height:2px; border-radius:50%; background:#a855f7; }

        /* ── PARTICLES ── */
        .p {
          position: absolute;
          border-radius: 50%;
          animation: floatP linear infinite;
        }
        .p1{width:3px;height:3px;left:62%;top:85%;background:rgba(192,132,252,.8);box-shadow:0 0 5px rgba(192,132,252,.8);animation-duration:7s;}
        .p2{width:2px;height:2px;left:75%;top:10%;background:rgba(129,140,248,.7);animation-duration:9s;animation-delay:-3s;}
        .p3{width:3px;height:3px;left:45%;top:90%;background:rgba(232,121,249,.6);animation-duration:6s;animation-delay:-1s;}
        .p4{width:2px;height:2px;left:88%;top:40%;background:rgba(168,85,247,.7);animation-duration:8s;animation-delay:-4s;}
        @keyframes floatP { 0%{transform:translateY(0);opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(-65px);opacity:0;} }

        /* ── CONTENT ── */
        .content {
          position: relative;
          z-index: 2;
          height: 100%;
          display: flex;
          align-items: center;
          padding: 0 52px;
          gap: 0;
          justify-content: space-between;
        }

        /* LEFT side */
        .left { flex: 1; }

        .pill {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          border: 1px solid rgba(168,85,247,0.4);
          border-radius: 999px;
          padding: 4px 14px;
          font-size: 11px; font-weight:600;
          color: #c084fc;
          letter-spacing: 1.4px;
          text-transform: uppercase;
          margin-bottom: 14px;
          animation: fadeUp 0.6s ease forwards;
        }
        .live {
          width:7px; height:7px; border-radius:50%;
          background:#4ade80;
          box-shadow:0 0 6px #4ade80, 0 0 10px rgba(74,222,128,0.4);
          animation: pulseLive 2s ease-in-out infinite;
        }
        @keyframes pulseLive { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        .name {
          font-size: 46px;
          font-weight: 800;
          letter-spacing: -1px;
          line-height: 1.05;
          background: linear-gradient(90deg, #c084fc 0%, #e879f9 40%, #818cf8 80%, #c084fc 100%);
          background-size: 250% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          filter: drop-shadow(0 0 20px rgba(192,132,252,0.5));
          margin-bottom: 10px;
          animation: nameGlow 4s linear infinite, fadeUp 0.7s 0.1s ease both;
        }
        @keyframes nameGlow { 0%{background-position:0% center;} 100%{background-position:250% center;} }

        .tagline {
          font-size: 14px;
          color: rgba(216,180,254,0.65);
          letter-spacing: 0.5px;
          margin-bottom: 20px;
          animation: fadeUp 0.7s 0.2s ease both;
        }
        .sep { color: rgba(168,85,247,0.5); margin: 0 8px; }

        .badges {
          display: flex;
          gap: 10px;
          animation: fadeUp 0.7s 0.3s ease both;
        }
        .badge {
          font-size: 12px;
          color: rgba(216,180,254,0.8);
          font-weight: 500;
          border-bottom: 1px solid rgba(168,85,247,0.35);
          padding-bottom: 2px;
        }

        @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

        /* RIGHT side — minimal code block, no card background */
        .right {
          flex: 0 0 auto;
          width: 248px;
          animation: fadeUp 0.8s 0.4s ease both;
        }

        .filename {
          font-family: 'Courier New', monospace;
          font-size: 11px;
          color: rgba(168,85,247,0.5);
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .filename::before {
          content: '';
          display: inline-block;
          width: 20px; height: 1px;
          background: rgba(168,85,247,0.4);
        }

        .code {
          font-family: 'Courier New', monospace;
          font-size: 12.5px;
          line-height: 1.9;
          border-left: 2px solid rgba(168,85,247,0.3);
          padding-left: 14px;
        }
        .kw  { color: #c084fc; font-weight:600; }
        .cn  { color: #818cf8; }
        .st  { color: #86efac; }
        .op  { color: rgba(168,85,247,0.8); }
        .cm  { color: rgba(148,163,184,0.4); font-style:italic; font-size:11px; }

        .cursor {
          display: inline-block;
          width: 7px; height: 13px;
          background: #c084fc;
          border-radius: 1px;
          vertical-align: middle;
          box-shadow: 0 0 8px rgba(192,132,252,0.9);
          animation: blink 1.1s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
      </style>

      <div class="root">
        <!-- Background layers -->
        <div class="grid"></div>
        <div class="vignette"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
        <div class="nline nl1"></div>
        <div class="nline nl2"></div>
        <div class="bar"></div>

        <!-- Stars -->
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>
        <div class="star s5"></div>
        <div class="star s6"></div>

        <!-- Dot grid -->
        <div class="dotgrid">
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
          <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div>
        </div>

        <!-- Particles -->
        <div class="p p1"></div>
        <div class="p p2"></div>
        <div class="p p3"></div>
        <div class="p p4"></div>

        <!-- Main content -->
        <div class="content">

          <!-- LEFT -->
          <div class="left">
            <div class="pill"><div class="live"></div>Open to opportunities</div>
            <div class="name">Humera Mahreen</div>
            <div class="tagline">
              Applied AI <span class="sep">&#183;</span> GenAI <span class="sep">&#183;</span> Agentic AI Explorer
            </div>
            <div class="badges">
              <span class="badge">🤖 Machine Learning</span>
              <span class="badge">✨ GenAI &amp; LLMs</span>
              <span class="badge">📍 Hyderabad, IN</span>
            </div>
          </div>

          <!-- RIGHT: bare code, no card box -->
          <div class="right">
            <div class="filename">humera.py</div>
            <div class="code">
              <div><span class="kw">class</span> <span class="cn">Humera</span><span class="op">:</span></div>
              <div><span class="cm">&#160;&#160;# ML Explorer &#x1F680;</span></div>
              <div><span class="cn">&#160;&#160;passion</span> <span class="op">=</span> <span class="st">"ML &amp; GenAI"</span></div>
              <div><span class="cn">&#160;&#160;focus&#160;&#160;</span><span class="op">=</span> <span class="st">"GenAI &amp; LLMs"</span></div>
              <div><span class="cn">&#160;&#160;goal&#160;&#160;&#160;</span><span class="op">=</span> <span class="st">"Build &amp; Solve"</span></div>
              <div><span class="cn">&#160;&#160;city&#160;&#160;&#160;</span><span class="op">=</span> <span class="st">"Hyderabad &#x1F1EE;&#x1F1F3;"</span></div>
              <div>&#160;&#160;<span class="cursor"></span></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>
