<svg xmlns="http://www.w3.org/2000/svg" width="860" height="80" viewBox="0 0 860 80">
  <foreignObject width="860" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        .root{
          width:860px;height:80px;
          background:linear-gradient(135deg,#050210 0%,#0c0620 50%,#060215 100%);
          border-radius:10px;overflow:hidden;position:relative;
          font-family:'Segoe UI',system-ui,sans-serif;
          display:flex;align-items:center;padding:0 36px;
        }

        .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(168,85,247,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,0.08) 1px,transparent 1px);background-size:30px 30px;}

        .orb{position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none;}
        .o1{width:180px;height:180px;background:rgba(79,70,229,0.45);top:-80px;left:-40px;}
        .o2{width:150px;height:150px;background:rgba(124,58,237,0.35);bottom:-70px;right:-30px;}

        /* Geometric - circles this time for variety */
        .ring{position:absolute;border-radius:50%;border:1.5px solid;pointer-events:none;animation:ringSpin linear infinite;}
        .r1{width:50px;height:50px;border-color:rgba(129,140,248,0.2);top:50%;right:180px;margin-top:-25px;animation-duration:18s;}
        .r2{width:32px;height:32px;border-color:rgba(192,132,252,0.25);top:50%;right:165px;margin-top:-16px;animation-duration:12s;animation-direction:reverse;}
        .r3{width:40px;height:40px;border-color:rgba(99,102,241,0.2);top:50%;left:100px;margin-top:-20px;animation-duration:22s;}
        @keyframes ringSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

        /* Triangle accent bottom-left */
        .tri{bottom:-8px;left:100px;width:0;height:0;border-left:35px solid transparent;border-right:35px solid transparent;border-top:60px solid rgba(168,85,247,0.05);position:absolute;}

        /* Diamond shapes */
        .dia{position:absolute;border:1px solid rgba(168,85,247,0.2);transform:rotate(45deg);animation:diaFloat ease-in-out infinite;}
        .d1{width:12px;height:12px;top:14px;right:320px;animation-duration:6s;}
        .d2{width:8px;height:8px;bottom:14px;right:340px;animation-duration:8s;animation-delay:-3s;}
        .d3{width:10px;height:10px;top:14px;left:180px;animation-duration:7s;animation-delay:-2s;border-color:rgba(129,140,248,0.25);}
        @keyframes diaFloat{0%,100%{opacity:0.4;}50%{opacity:0.9;}}

        .accent-line{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent,#6366f1,#a855f7,transparent);box-shadow:0 0 8px rgba(99,102,241,0.5);}

        .dots{position:absolute;right:36px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;}
        .dot{width:4px;height:4px;border-radius:50%;background:#818cf8;opacity:0.4;}
        .dot:nth-child(2){opacity:0.6;}
        .dot:nth-child(3){opacity:0.8;}

        .tline{position:absolute;top:0;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,0.5),rgba(168,85,247,0.7),rgba(99,102,241,0.5),transparent);animation:linePulse 4s ease-in-out infinite;}
        .bline{position:absolute;bottom:0;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,rgba(168,85,247,0.4),rgba(99,102,241,0.6),rgba(168,85,247,0.4),transparent);animation:linePulse 4s ease-in-out infinite;animation-delay:-2s;}
        @keyframes linePulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

        .content{position:relative;z-index:2;display:flex;align-items:center;gap:16px;width:100%;}

        .icon{
          width:36px;height:36px;border-radius:8px;
          background:rgba(99,102,241,0.1);
          border:1px solid rgba(99,102,241,0.25);
          display:flex;align-items:center;justify-content:center;
          font-size:18px;
          box-shadow:0 0 12px rgba(99,102,241,0.1);
          flex-shrink:0;
        }

        .text-group{display:flex;flex-direction:column;gap:2px;}
        .label{font-size:10px;color:rgba(99,102,241,0.6);letter-spacing:3px;text-transform:uppercase;font-weight:600;}
        .title{
          font-size:22px;font-weight:800;letter-spacing:-0.5px;
          background:linear-gradient(90deg,#818cf8,#c084fc,#6366f1);
          background-size:200% auto;
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
          filter:drop-shadow(0 0 10px rgba(129,140,248,0.4));
          animation:titleShimmer 5s linear infinite;
        }
        @keyframes titleShimmer{0%{background-position:0% center;}100%{background-position:200% center;}}

        .vdiv{width:1px;height:36px;background:linear-gradient(180deg,transparent,rgba(99,102,241,0.4),transparent);flex-shrink:0;}
      </style>
      <div class="root">
        <div class="grid"></div>
        <div class="orb o1"></div><div class="orb o2"></div>
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="tri"></div>
        <div class="dia d1"></div><div class="dia d2"></div><div class="dia d3"></div>
        <div class="accent-line"></div>
        <div class="tline"></div><div class="bline"></div>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="content">
          <div class="text-group">
            <div class="label">✦ Section</div>
            <div class="title">GitHub Stats</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
