<svg xmlns="http://www.w3.org/2000/svg" width="860" height="80" viewBox="0 0 860 80">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="25%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e879f9" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wave line 3 - back, faint -->
  <path d="M0,55 C100,35 180,65 280,48 C380,30 440,58 540,42 C640,26 720,52 860,38"
    fill="none" stroke="url(#waveGrad3)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="d"
      values="
        M0,55 C100,35 180,65 280,48 C380,30 440,58 540,42 C640,26 720,52 860,38;
        M0,42 C100,58 180,36 280,56 C380,68 440,40 540,55 C640,65 720,38 860,52;
        M0,55 C100,35 180,65 280,48 C380,30 440,58 540,42 C640,26 720,52 860,38"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Wave line 2 - mid -->
  <path d="M0,62 C80,44 160,68 260,52 C360,36 430,62 530,48 C630,32 730,58 860,44"
    fill="none" stroke="url(#waveGrad2)" stroke-width="2" filter="url(#glow)" opacity="0.8">
    <animate attributeName="d"
      values="
        M0,62 C80,44 160,68 260,52 C360,36 430,62 530,48 C630,32 730,58 860,44;
        M0,48 C80,64 160,42 260,60 C360,72 430,46 530,62 C630,72 730,44 860,58;
        M0,62 C80,44 160,68 260,52 C360,36 430,62 530,48 C630,32 730,58 860,44"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Wave line 1 - front, brightest -->
  <path d="M0,68 C90,50 170,72 270,58 C370,42 440,66 545,52 C645,38 740,62 860,50"
    fill="none" stroke="url(#waveGrad1)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="d"
      values="
        M0,68 C90,50 170,72 270,58 C370,42 440,66 545,52 C645,38 740,62 860,50;
        M0,52 C90,68 170,46 270,64 C370,76 440,52 545,66 C645,76 740,50 860,64;
        M0,68 C90,50 170,72 270,58 C370,42 440,66 545,52 C645,38 740,62 860,50"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Floating dots on the wave -->
  <circle cx="215" cy="58" r="2.5" fill="#c084fc" opacity="0.8" filter="url(#glow)">
    <animate attributeName="cy" values="58;44;58" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="52" r="2" fill="#e879f9" opacity="0.7" filter="url(#glow)">
    <animate attributeName="cy" values="52;66;52" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="48" r="2.5" fill="#818cf8" opacity="0.8" filter="url(#glow)">
    <animate attributeName="cy" values="48;62;48" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>


</svg>
