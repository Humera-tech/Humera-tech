<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F2B2E"/>
    </linearGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9F68" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF9F68" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9FB3C8" opacity="0.12"/>
    </pattern>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <ellipse cx="960" cy="70" rx="260" ry="170" fill="url(#glowAmber)"/>
  <ellipse cx="1010" cy="210" rx="230" ry="160" fill="url(#glowMint)"/>

  <!-- agent network, right side -->
  <g stroke="#7A93A8" stroke-width="1" opacity="0.45">
    <line x1="820" y1="70"  x2="890" y2="46"/>
    <line x1="890" y1="46"  x2="955" y2="86"/>
    <line x1="890" y1="46"  x2="878" y2="128"/>
    <line x1="955" y1="86"  x2="1018" y2="56"/>
    <line x1="1018" y1="56" x2="1112" y2="98"/>
    <line x1="878" y1="128" x2="948" y2="160"/>
    <line x1="878" y1="128" x2="900" y2="216"/>
    <line x1="948" y1="160" x2="1026" y2="140"/>
    <line x1="948" y1="160" x2="996" y2="226"/>
    <line x1="1026" y1="140" x2="1064" y2="188"/>
    <line x1="900" y1="216" x2="996" y2="226"/>
    <line x1="996" y1="226" x2="1064" y2="188"/>
    <line x1="1064" y1="188" x2="1112" y2="98"/>
    <line x1="1064" y1="188" x2="1134" y2="214"/>
  </g>

  <!-- hub glows -->
  <circle cx="890" cy="46" r="16" fill="#FF9F68" opacity="0.35" filter="url(#soften)"/>
  <circle cx="878" cy="128" r="18" fill="#6EE7B7" opacity="0.30" filter="url(#soften)"/>
  <circle cx="1064" cy="188" r="16" fill="#6EE7B7" opacity="0.28" filter="url(#soften)"/>

  <!-- nodes -->
  <g>
    <circle cx="820" cy="70"  r="4" fill="#FF9F68"/>
    <circle cx="890" cy="46"  r="7" fill="#FF9F68"/>
    <circle cx="955" cy="86"  r="4" fill="#6EE7B7"/>
    <circle cx="1018" cy="56" r="5" fill="#FF9F68"/>
    <circle cx="1112" cy="98" r="5" fill="#FF9F68"/>
    <circle cx="878" cy="128" r="8" fill="#6EE7B7"/>
    <circle cx="948" cy="160" r="4" fill="#FF9F68"/>
    <circle cx="1026" cy="140" r="5" fill="#6EE7B7"/>
    <circle cx="900" cy="216" r="6" fill="#FF9F68"/>
    <circle cx="996" cy="226" r="4" fill="#6EE7B7"/>
    <circle cx="1064" cy="188" r="7" fill="#6EE7B7"/>
    <circle cx="1134" cy="214" r="4" fill="#FF9F68"/>
  </g>

  <!-- name -->
  <text x="70" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="62" font-weight="700" letter-spacing="-1.5" fill="#F5F7FA">
    Humera Mahreen
  </text>

  <!-- signal underline -->
  <path d="M71 152 Q 106 136, 141 152 T 211 152 T 281 152 T 351 152"
        stroke="#FF9F68" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- role tags -->
  <g font-family="'Consolas','Menlo','Courier New',monospace" font-size="15" fill="#D7E6E4">
    <rect x="70" y="190" width="128" height="34" rx="17" fill="none" stroke="#6EE7B7" stroke-width="1.2" opacity="0.65"/>
    <text x="90" y="212">Applied AI</text>

    <rect x="212" y="190" width="82" height="34" rx="17" fill="none" stroke="#FF9F68" stroke-width="1.2" opacity="0.65"/>
    <text x="232" y="212">GenAI</text>

    <rect x="308" y="190" width="220" height="34" rx="17" fill="none" stroke="#D7E6E4" stroke-width="1" opacity="0.35"/>
    <text x="328" y="212">Agentic AI Explorer</text>
  </g>
</svg>
