<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F2B2E"/>
    </linearGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9F68" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF9F68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9FB3C8" opacity="0.12"/>
    </pattern>

    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- shimmer sweep across the name -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="42%" stop-color="#F5F7FA"/>
      <stop offset="50%" stop-color="#FFE3C2"/>
      <stop offset="58%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                         values="-1 0; 1 0; -1 0" dur="4.5s" repeatCount="indefinite" begin="1.2s"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <ellipse cx="990" cy="56" rx="240" ry="119" fill="url(#glowAmber)"/>
  <ellipse cx="210" cy="231" rx="230" ry="112" fill="url(#glowMint)"/>

  <!-- top-right orbit cluster -->
  <g opacity="0.85">
    <path d="M1000,56 Q965,38.5 930,35" stroke="#7A93A8" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M1000,56 Q1030,38.5 1060,28" stroke="#7A93A8" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M1000,56 Q1045,73.5 1080,91" stroke="#7A93A8" stroke-width="1" fill="none" opacity="0.5"/>

    <circle cx="1000" cy="56" r="16" fill="#FF9F68" opacity="0.35" filter="url(#glowBlur)"/>
    <circle cx="1000" cy="56" r="8" fill="#FF9F68"/>
    <circle cx="930" cy="35" r="4" fill="#6EE7B7"/>
    <circle cx="1060" cy="28" r="4" fill="#6EE7B7"/>
    <circle cx="1080" cy="91" r="4" fill="#FF9F68"/>

    <!-- orbiting pulse -->
    <circle r="3" fill="#6EE7B7">
      <animateMotion dur="7s" repeatCount="indefinite"
                      path="M1000,56 m-42,0 a42,18 0 1,0 84,0 a42,18 0 1,0 -84,0"/>
    </circle>
  </g>

  <!-- bottom-left orbit cluster -->
  <g opacity="0.85">
    <path d="M200,231 Q165,217 130,210" stroke="#7A93A8" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M200,231 Q235,217 270,210" stroke="#7A93A8" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M200,231 Q175,246 150,259" stroke="#7A93A8" stroke-width="1" fill="none" opacity="0.5"/>

    <circle cx="200" cy="231" r="16" fill="#6EE7B7" opacity="0.3" filter="url(#glowBlur)"/>
    <circle cx="200" cy="231" r="8" fill="#6EE7B7"/>
    <circle cx="130" cy="210" r="4" fill="#FF9F68"/>
    <circle cx="270" cy="210" r="4" fill="#FF9F68"/>
    <circle cx="150" cy="259" r="4" fill="#6EE7B7"/>

    <!-- orbiting pulse -->
    <circle r="3" fill="#FF9F68">
      <animateMotion dur="6s" repeatCount="indefinite"
                      path="M200,231 m-42,0 a42,18 0 1,0 84,0 a42,18 0 1,0 -84,0"/>
    </circle>
  </g>

  <!-- name, centered, slides up + fades in, then shimmer sweep -->
  <text x="600" y="133" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1" fill="url(#shimmer)" opacity="0">
    Humera Mahreen
    <animateTransform attributeName="transform" type="translate" from="0 30" to="0 0"
                       dur="0.9s" begin="0.1s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.1s" fill="freeze"/>
  </text>

  <!-- wavy signal underline -->
  <path d="M410 155 Q 455 143, 500 155 T 590 155 T 680 155 T 770 155"
        stroke="#FF9F68" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- role pills, centered -->
  <g font-family="'Consolas','Menlo','Courier New',monospace" font-size="14" fill="#D7E6E4">
    <rect x="369" y="181" width="130" height="30" rx="15" fill="none" stroke="#6EE7B7" stroke-width="1.2" opacity="0.65"/>
    <text x="389" y="201">Applied AI</text>

    <rect x="513" y="181" width="85" height="30" rx="15" fill="none" stroke="#FF9F68" stroke-width="1.2" opacity="0.65"/>
    <text x="533" y="201">GenAI</text>

    <rect x="612" y="181" width="220" height="30" rx="15" fill="none" stroke="#D7E6E4" stroke-width="1" opacity="0.35"/>
    <text x="632" y="201">Agentic AI Explorer</text>
  </g>
</svg>
