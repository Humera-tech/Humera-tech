<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- corner ticks, sheet-closing mark -->
  <g stroke="#4FD1E8" stroke-width="1.2" opacity="0.45">
    <path d="M16 16 L36 16 M16 16 L16 36"/>
    <path d="M1184 16 L1164 16 M1184 16 L1184 36"/>
    <path d="M16 134 L36 134 M16 134 L16 114"/>
    <path d="M1184 134 L1164 134 M1184 134 L1184 114"/>
  </g>

  <!-- trace with traveling signal pulse -->
  <line x1="30" y1="40" x2="1170" y2="40" stroke="#4FD1E8" stroke-width="1.2" opacity="0.35"/>
  <circle cx="30" cy="40" r="3" fill="#4FD1E8"/>
  <circle cx="1170" cy="40" r="3" fill="#4FD1E8"/>

  <!-- comet trail -->
  <circle r="3" fill="#FFB454" opacity="0.2">
    <animateMotion dur="4s" begin="-0.2s" repeatCount="indefinite" path="M30,40 L1170,40"/>
  </circle>
  <circle r="3.5" fill="#FFB454" opacity="0.4">
    <animateMotion dur="4s" begin="-0.1s" repeatCount="indefinite" path="M30,40 L1170,40"/>
  </circle>
  <circle r="4.5" fill="#FFB454">
    <animateMotion dur="4s" repeatCount="indefinite" path="M30,40 L1170,40"/>
  </circle>

  <!-- title chip -->
  <rect x="435" y="20" width="330" height="40" rx="4" fill="#0A2540" stroke="#4FD1E8" stroke-width="1.4"/>
  <text x="600" y="46" text-anchor="middle" font-family="'Consolas','Menlo','Courier New',monospace"
        font-size="18" letter-spacing="3" fill="#F4FAFC">THANKS FOR VISITING</text>

  <!-- subtext with twinkling star -->
  <text x="565" y="100" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="16" fill="#BFE1F0">Star a repo if you find it helpful</text>

  <g transform="translate(585,95)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.35;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.4s" repeatCount="indefinite"/>
      <path d="M0,-10 L2.35,-3.09 L9.51,-3.09 L3.82,1.18 L5.88,7.9 L0,3.6 L-5.88,7.9 L-3.82,1.18 L-9.51,-3.09 L-2.35,-3.09 Z"
            fill="#FFD27A"/>
    </g>
  </g>

  <!-- sheet end annotation -->
  <text x="1160" y="128" text-anchor="end" font-family="'Consolas','Menlo','Courier New',monospace"
        font-size="10" letter-spacing="1" fill="#4FD1E8" opacity="0.4">EOF</text>
</svg>
